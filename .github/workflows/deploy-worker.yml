name: Deploy Cloudflare Worker

on:
  push:
    branches: [master]
    paths:
      # Must stay a directory glob. Listing individual files meant the
      # screener_*.js modules were not deploy triggers, so fixes to them
      # landed on master and never shipped.
      - 'cloudflare/**'

# Only one deploy at a time, and the newest commit wins.
#
# Without this, run #61 sat Queued for seventeen hours during a GitHub runner
# backlog and could not be cleared: the UI returns "Failed to cancel workflow"
# and the API only allows deleting runs that have already completed. The next
# push now supersedes a stuck run instead of joining it in the queue.
#
# cancel-in-progress is correct for a deploy specifically: if two commits land
# together, letting the older one finish would put a superseded worker live.
concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
          secrets: |
            GEMINI_API_KEY
            FMP_API_KEY
            GSHEET_URL
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GSHEET_URL: ${{ secrets.GSHEET_URL }}
