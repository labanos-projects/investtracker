name: Deploy PHP to labanos.dk

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'php/notes.php'
      - 'php/transactions.php'
      - 'php/portfolio.php'
      - 'php/portfolio_history.php'
      - 'php/db_migrate.php'
      - 'php/valuations.php'
      - 'php/sql.php'
      - 'php/watchlists.php'
      - 'php/watchlist_items.php'
      - '.github/workflows/deploy-php.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets
        run: |
          FILES="php/notes.php php/transactions.php php/portfolio.php php/portfolio_history.php php/db_migrate.php php/valuations.php php/sql.php php/watchlists.php php/watchlist_items.php"
          sed -i "s|%%DB_HOST%%|${{ secrets.DB_HOST }}|g" $FILES
          sed -i "s|%%DB_NAME%%|${{ secrets.DB_NAME }}|g" $FILES
          sed -i "s|%%DB_USER%%|${{ secrets.DB_USER }}|g" $FILES
          sed -i "s|%%DB_PASS%%|${{ secrets.DB_PASS }}|g" $FILES
          sed -i "s|%%CLAUDE_SQL_TOKEN%%|${{ secrets.CLAUDE_SQL_TOKEN }}|g" $FILES

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy via SFTP
        run: |
          sshpass -p "${{ secrets.SFTP_PASS }}" sftp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -P ${{ secrets.SFTP_PORT }} \
            "${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}" <<'SFTP'
          put php/notes.php notes.php
          put php/transactions.php transactions.php
          put php/portfolio.php portfolio.php
          put php/portfolio_history.php portfolio_history.php
          put php/db_migrate.php db_migrate.php
          put php/valuations.php valuations.php
          put php/sql.php sql.php
          put php/watchlists.php watchlists.php
          put php/watchlist_items.php watchlist_items.php
          SFTP

      - name: Done
        run: echo "✅ PHP files deployed to labanos.dk"
