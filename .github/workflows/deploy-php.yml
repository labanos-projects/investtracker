name: Deploy PHP to labanos.dk

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'php/*.php'
      - '.github/workflows/deploy-php.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets
        run: |
          FILES=$(ls php/*.php)
          sed -i "s|%%DB_HOST%%|${{ secrets.DB_HOST }}|g" $FILES
          sed -i "s|%%DB_NAME%%|${{ secrets.DB_NAME }}|g" $FILES
          sed -i "s|%%DB_USER%%|${{ secrets.DB_USER }}|g" $FILES
          sed -i "s|%%DB_PASS%%|${{ secrets.DB_PASS }}|g" $FILES
          sed -i "s|%%CLAUDE_SQL_TOKEN%%|${{ secrets.CLAUDE_SQL_TOKEN }}|g" $FILES

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy via SFTP
        run: |
          sshpass -p "${{ secrets.SFTP_PASS }}" sftp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -P ${{ secrets.SFTP_PORT }} \
            "${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}" <<'SFTP'
          lcd php
          mput *.php
          SFTP

      - name: Done
        run: echo "✅ PHP files deployed to labanos.dk"
